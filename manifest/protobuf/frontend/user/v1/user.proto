syntax = "proto3";

package frontend_user;

option go_package = "jh_app_service/api/frontend/user/v1";

service User {
    rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoRes) {}
    rpc Logout(LogoutReq) returns (LogoutRes) {}
    rpc BindEmail(BindEmailReq) returns (BindEmailRes) {}
    rpc BindMobile(BindMobileReq) returns (BindMobileRes) {}
    rpc ChangeLoginPassword(ChangeLoginPasswordReq) returns (ChangeLoginPasswordRes) {}
    rpc BindLoginPassword(BindLoginPasswordReq) returns (BindLoginPasswordRes) {}
    rpc GetGradeList(GetGradeListReq) returns (GetGradeListRes) {}
    rpc SetPayPassword(SetPayPasswordReq) returns (SetPayPasswordRes) {}
    rpc VerifyPayPassword(VerifyPayPasswordReq) returns (VerifyPayPasswordRes) {}
    rpc ChangePayPassword(ChangePayPasswordReq) returns (ChangePayPasswordRes) {}
    
    // 邀请相关接口
    rpc GetInviteInfo(GetInviteInfoReq) returns (GetInviteInfoRes) {}
    rpc GetInviteList(GetInviteListReq) returns (GetInviteListRes) {}
}

// 获取用户信息请求
message GetUserInfoReq {
}

// 获取用户信息响应
message GetUserInfoRes {
    int32 user_id = 1;              // 用户名
    string username = 2;              // 用户名
    string realname = 3;              // 真实姓名
    string email = 4;                 // 邮箱
    string mobile = 5;                // 手机号
    string birthday = 8;              // 生日
    string last_login_time = 9;       // 最后登录时间
    string last_login_address = 10;    // 最后登录地址

    // 等级相关
    int32 grade_id = 12;              // 会员等级ID
    string grade_name = 13;           // 会员等级名称
    
    // 绑定状态
    int32 is_pay_password = 27;       // 是否设置资金密码 0=未设置 1=已设置
    int32 is_password = 28;           // 是否设置登录密码 0=未设置 1=已设置
    
    // 其他
    int32 unread_message_count = 17;  // 未读消息数量

}

// 最后记录
message LastRecord {
    int32 id = 1;
    string amount = 2;
    string created_at = 3;
}

// 最后消息
message LastMessage {
    int32 id = 1;
    string title = 2;
    string created_at = 3;
}

// 退出登录请求
message LogoutReq {
}

// 退出登录响应
message LogoutRes {
    string message = 1;  // 提示消息
}

// 绑定邮箱请求
message BindEmailReq {
    string email = 1;  // 邮箱地址
}

// 绑定邮箱响应
message BindEmailRes {
    string message = 1;  // 提示消息
}

// 绑定手机请求
message BindMobileReq {
    string mobile = 1;  // 手机号
}

// 绑定手机响应
message BindMobileRes {
    string message = 1;  // 提示消息
}

// 修改登录密码请求
message ChangeLoginPasswordReq {
    string old_password = 1;  // 原密码
    string new_password = 2;  // 新密码
}

// 修改登录密码响应
message ChangeLoginPasswordRes {
    string message = 1;  // 提示消息
}

// 绑定登录密码请求（针对快速注册用户）
message BindLoginPasswordReq {
    string new_password = 1;  // 新密码
}

// 绑定登录密码响应
message BindLoginPasswordRes {
    string message = 1;  // 提示消息
}

// 获取会员等级列表请求
message GetGradeListReq {
}

// 获取会员等级列表响应
message GetGradeListRes {
    repeated GradeItem list = 1;  // 等级列表
}

// 会员等级项
message GradeItem {
    int32 id = 1;                          // 等级ID
    string name = 2;                       // 等级名称
    string rebate_percent_sports = 6;      // 体育返水比例
    string rebate_percent_lottery = 7;     // 彩票返水比例
    string rebate_percent_live = 8;        // 真人视讯返水比例
    string rebate_percent_egame = 9;       // 电子游戏返水比例
    string rebate_percent_poker = 10;      // 棋牌返水比例
    string payment_limit = 11;             // 充值金额
    string bet_limit = 12;                 // 投注金额
    string money_limit = 13;               // 升级礼金
}

// 设置支付密码请求
message SetPayPasswordReq {
    string pay_password = 1;  // 支付密码（6位数字）
}

// 设置支付密码响应
message SetPayPasswordRes {
    string message = 1;  // 提示消息
}

// 验证支付密码请求
message VerifyPayPasswordReq {
    string pay_password = 1;  // 支付密码
}

// 验证支付密码响应
message VerifyPayPasswordRes {
    bool is_valid = 1;     // 是否正确
    string message = 2;    // 提示消息
}

// 修改支付密码请求
message ChangePayPasswordReq {
    string old_pay_password = 1;  // 旧支付密码（6位数字）
    string new_pay_password = 2;  // 新支付密码（6位数字）
}

// 修改支付密码响应
message ChangePayPasswordRes {
    string message = 1;  // 提示消息
}

// 获取邀请信息请求
message GetInviteInfoReq {
}

// 获取邀请信息响应
message GetInviteInfoRes {
    string invite_code = 1;        // 我的邀请码
    string invite_url = 2;          // 邀请链接
    int32 total_invites = 3;        // 总邀请人数
    int32 today_invites = 4;        // 今日邀请人数
    string total_reward = 5;        // 总奖励金额
    string today_income = 6;        // 今日邀请收入
    string yesterday_income = 7;   // 昨日邀请收入
    int32 registers = 8;            // 注册人数
    int32 valid_referral = 9;       // 有效邀请人数
}

// 获取邀请列表请求
message GetInviteListReq {
    int32 page = 1;                 // 页码
    int32 page_size = 2;            // 每页数量
}

// 获取邀请列表响应
message GetInviteListRes {
    repeated InviteItem list = 1;   // 邀请列表
    int32 total = 2;                // 总数
    int32 page = 3;                 // 当前页
    int32 page_size = 4;            // 每页数量
}

// 邀请项
message InviteItem {
    int32 user_id = 1;              // 用户ID
    string username = 2;            // 用户名
    string register_time = 3;       // 注册时间
    string total_bet = 4;           // 总投注
    string total_recharge = 5;      // 总充值
    int32 status = 6;               // 状态：1=正常，0=禁用
}
