syntax = "proto3";

package frontend_user;

option go_package = "jh_app_service/api/frontend/user/v1";

service User {
    rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoRes) {}
    rpc Logout(LogoutReq) returns (LogoutRes) {}
    rpc BindEmail(BindEmailReq) returns (BindEmailRes) {}
    rpc BindMobile(BindMobileReq) returns (BindMobileRes) {}
    rpc ChangeLoginPassword(ChangeLoginPasswordReq) returns (ChangeLoginPasswordRes) {}
}

// 获取用户信息请求
message GetUserInfoReq {
}

// 获取用户信息响应
message GetUserInfoRes {
    string username = 1;              // 用户名
    string realname = 2;              // 真实姓名
    string email = 3;                 // 邮箱
    string mobile = 4;                // 手机号
    string qq = 5;                    // QQ号
    int32 sex = 6;                    // 性别 0=保密 1=男 2=女
    string birthday = 7;              // 生日
    string last_login_time = 8;       // 最后登录时间
    string last_login_address = 9;    // 最后登录地址
    int32 show_beginner_guide = 10;   // 新手引导 0=不显示 1=显示

    // 余额相关（先写死默认值）
    string balance = 12;              // 余额
    string balance_frozen = 13;       // 冻结余额
    string points = 14;               // 积分
    
    // 等级相关
    int32 grade_id = 15;              // 会员等级ID
    string grade_name = 16;           // 会员等级名称
    
    // 绑定状态
    int32 bind_safe_question = 17;    // 是否绑定安全问题 0=未绑定 1=已绑定
    int32 bind_pay_password = 18;     // 是否绑定资金密码 0=未绑定 1=已绑定
    int32 bind_bank = 19;             // 是否绑定银行卡 0=未绑定 1=已绑定
    
    // 其他
    int32 unread_message_count = 20;  // 未读消息数量
    int32 switch_sign = 21;           // 签到开关 0=关闭 1=开启
    int32 apply_birthday_bonus = 22;  // 是否可申请生日礼金 0=不可 1=可以
    int32 auto_bind_game_balance = 23; // 自动绑定游戏余额 0=关闭 1=开启
    
    // 统计数据（先写死默认值）
    string total_bet = 24;            // 总投注
    string total_bonus = 25;          // 总彩金
    string total_rebate = 26;         // 总返水
    
    // 最后记录（先写死默认值）
    repeated LastRecord last_recharge = 27;  // 最后充值记录
    repeated LastRecord last_withdraw = 28;  // 最后提现记录
    repeated LastMessage last_message = 29;  // 最后消息
}

// 最后记录
message LastRecord {
    int32 id = 1;
    string amount = 2;
    string created_at = 3;
}

// 最后消息
message LastMessage {
    int32 id = 1;
    string title = 2;
    string created_at = 3;
}

// 退出登录请求
message LogoutReq {
}

// 退出登录响应
message LogoutRes {
    string message = 1;  // 提示消息
}

// 绑定邮箱请求
message BindEmailReq {
    string email = 1;  // 邮箱地址
}

// 绑定邮箱响应
message BindEmailRes {
    string message = 1;  // 提示消息
}

// 绑定手机请求
message BindMobileReq {
    string mobile = 1;  // 手机号
}

// 绑定手机响应
message BindMobileRes {
    string message = 1;  // 提示消息
}

// 修改登录密码请求
message ChangeLoginPasswordReq {
    string old_password = 1;  // 原密码
    string new_password = 2;  // 新密码
}

// 修改登录密码响应
message ChangeLoginPasswordRes {
    string message = 1;  // 提示消息
}
