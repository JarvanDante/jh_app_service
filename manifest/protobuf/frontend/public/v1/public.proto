syntax = "proto3";

package public;

option go_package = "jh_app_service/api/frontend/public/v1";

service Public {
    rpc QuickRegister(QuickRegisterReq) returns (QuickRegisterRes) {}
    rpc Register(RegisterReq) returns (RegisterRes) {}
    rpc Login(LoginReq) returns (LoginRes) {}
    rpc GenerateCaptcha(GenerateCaptchaReq) returns (GenerateCaptchaRes) {}
    rpc RefreshToken(RefreshTokenReq) returns (RefreshTokenRes) {}
    rpc GetSiteSetting(GetSiteSettingReq) returns (GetSiteSettingRes) {}
    rpc GetAppNoticeList(GetNoticeListReq) returns (GetNoticeListRes) {}
    rpc GetAppAdList(GetAdListReq) returns (GetAdListRes) {}
}

// 快速注册请求
message QuickRegisterReq {
    string time = 1;      // v: required
    string domain = 2;    // 注册域名
}

// 快速注册响应
message QuickRegisterRes {
    string token = 1;              // JWT token
    string username = 2;           // 用户名
    string refresh_token = 3;      // 刷新token
    int64 expires_in = 4;          // token过期时间（秒）
    int64 refresh_expires_in = 5;  // refresh_token过期时间（秒）
}


// 登录请求
message LoginReq {
    string username = 1;  // v: required
    string password = 2;  // v: required
    string code = 3;      // 验证码
    string time = 4;      // 时间戳
}

// 登录响应
message LoginRes {
    string token = 1;              // JWT token
    string refresh_token = 2;      // 刷新token
    int64 expires_in = 3;          // token过期时间（秒）
    int64 refresh_expires_in = 4;  // refresh_token过期时间（秒）
}


// 生成验证码请求
message GenerateCaptchaReq {
    string time = 1;      // v: required
}

// 生成验证码响应
message GenerateCaptchaRes {
    bytes image = 1;      // 验证码图片数据
    string content_type = 2; // 图片类型
}

// 刷新token请求
message RefreshTokenReq {
    string refresh_token = 1;  // v: required
}

// 刷新token响应
message RefreshTokenRes {
    string token = 1;              // 新的JWT token
    string refresh_token = 2;      // 新的刷新token
    int64 expires_in = 3;          // token过期时间（秒）
    int64 refresh_expires_in = 4;  // refresh_token过期时间（秒）
}

// 注册请求
message RegisterReq {
    string username = 1;      // v: required
    string password = 2;      // v: required
    string mobile = 3;        // 手机号
    string code = 4;          // 图片验证码
    string time = 5;          // 时间戳
    string phone_code = 6;    // 手机验证码
    string pay_password = 7;  // 资金密码
    string realname = 8;      // 真实姓名
    string email = 9;         // 邮箱
    string birthday = 10;     // 生日
    string agent_salt = 11;   // 代理码
    string domain = 12;       // 注册域名
}

// 注册响应
message RegisterRes {
    string token = 1;              // JWT token
    string refresh_token = 2;      // 刷新token
    int64 expires_in = 3;          // token过期时间（秒）
    int64 refresh_expires_in = 4;  // refresh_token过期时间（秒）
}

// 获取用户信息请求
message GetUserInfoReq {
    // 从JWT token中获取用户信息，无需参数
}

// 获取用户信息响应
message GetUserInfoRes {
    string username = 1;              // 用户名
    string realname = 2;              // 真实姓名
    string email = 3;                 // 邮箱
    string mobile = 4;                // 手机号
    string qq = 5;                    // QQ号
    int32 sex = 6;                    // 性别 0=未知 1=男 2=女
    string birthday = 7;              // 生日
    string last_login_time = 8;       // 最后登录时间
    string last_login_address = 9;    // 最后登录地址
    int32 show_beginner_guide = 10;   // 新手引导 0=不显示 1=显示
    string gpwd = 11;                 // 游戏密码(base64)
    string balance = 12;              // 余额(默认值)
    string balance_frozen = 13;       // 冻结余额(默认值)
    string points = 14;               // 积分(默认值)
    int32 grade_id = 15;              // 会员等级ID
    string grade_name = 16;           // 会员等级名称
    int32 bind_safe_question = 17;    // 是否绑定安全问题 0=否 1=是
    int32 bind_pay_password = 18;     // 是否绑定资金密码 0=否 1=是
    int32 unread_message_count = 19;  // 未读消息数量(默认值)
    int32 switch_sign = 20;           // 签到开关 0=关闭 1=开启
    // int32 bind_bank = 21;             // 是否绑定银行卡 0=否 1=是 (已移至balance服务)
    int32 apply_birthday_bonus = 22;  // 是否可申请生日礼金 0=否 1=是
    int32 auto_bind_game_balance = 23;// 自动绑定游戏余额 0=否 1=是
    string total_bet = 24;            // 总投注(默认值)
    string total_bonus = 25;          // 总彩金(默认值)
    string total_rebate = 26;         // 总返水(默认值)
    repeated LastRecord last_recharge = 27;  // 最后充值记录(默认值)
    repeated LastRecord last_withdraw = 28;  // 最后提现记录(默认值)
    repeated LastMessage last_message = 29;  // 最后消息(默认值)
}

// 最后记录
message LastRecord {
    int32 id = 1;
    string amount = 2;
    string created_at = 3;
}

// 最后消息
message LastMessage {
    int32 id = 1;
    string title = 2;
    string created_at = 3;
}

// 获取站点设置请求
message GetSiteSettingReq {
    // 无需参数
}

// 获取站点设置响应
message GetSiteSettingRes {
    string agent_url = 1;         // 代理url
    string site_name = 2;         // 站点名称
    string mobile_url = 3;        // 手机url
    int32 switch_register = 4;    // 会员注册开关 0=关闭 1=开启
    int32 switch_grade = 5;       // 会员等级开关 0=关闭 1=开启
    string service_url = 6;       // 客服链接
    int32 close = 7;              // 站点关闭开关 0=正常 1=关闭
    string min_withdraw = 8;      // 单笔最小提现金额
    string max_withdraw = 9;      // 单笔最大提现金额
    string mobile_logo = 10;      // 手机端logo
    string close_reason = 11;     // 站点关闭理由
}

// 获取公告列表请求
message GetNoticeListReq {
    int32 limit = 1;  // 限制数量，默认3
}

// 获取公告列表响应
message GetNoticeListRes {
    repeated NoticeItem list = 1;  // 公告列表
}

// 公告项
message NoticeItem {
    string title = 1;       // 标题
    string url = 2;         // 链接
    string content = 3;     // 内容
    string created_at = 4;  // 创建时间
}

// 获取广告列表请求
message GetAdListReq {
    int32 mobile = 1;  // 是否手机端 0=PC 1=手机
}

// 获取广告列表响应
message GetAdListRes {
    repeated AdItem list = 1;  // 广告列表
}

// 广告项
message AdItem {
    string name = 1;         // 名称
    string image = 2;        // 图片地址
    string url = 3;          // 链接
    int32 type = 4;          // 类型 1=首页图片弹窗 2=首页悬浮图片 3=首页banner图片
    int32 before_login = 5;  // 登录前显示 0=登录后 1=登录前
    int32 position = 6;      // 位置 1=PC 2=WAP
    int32 sort = 7;          // 排序
}
