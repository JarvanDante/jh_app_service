// protoc --go_out=plugins=grpc:. *.proto

syntax = "proto3";

package site;

option go_package = "jh_app_service/api/backend/site/v1";

service Site {
    rpc GetBasicSetting(GetBasicSettingReq) returns (GetBasicSettingRes) {}
    rpc UpdateBasicSetting(UpdateBasicSettingReq) returns (UpdateBasicSettingRes) {}
    rpc GetInviteBonusConfig(GetInviteBonusConfigReq) returns (GetInviteBonusConfigRes) {}
    rpc GetSiteActivityList(GetSiteActivityListReq) returns (GetSiteActivityListRes) {}
    rpc UpdateSiteActivity(UpdateSiteActivityReq) returns (UpdateSiteActivityRes) {}
}

message GetBasicSettingReq {
    // 站点ID，可选，如果不传则使用当前站点
    int32 site_id = 1;
}

message GetBasicSettingRes {
    string code = 1;                        // 站点代码
    string name = 2;                        // 站点名称
    int32 register_time_interval = 3;       // 同一IP重复注册时间间隔
    bool switch_register = 4;               // 是否开放注册
    bool is_close = 5;                      // 是否关闭站点
    string close_reason = 6;                // 关闭原因
    string url_service = 7;                 // 客服链接
    string url_agent_pc = 8;                // 代理链接地址
    string url_mobile = 9;                  // 手机域名地址
    string url_agent_register = 10;         // 代理推广地址
    int32 min_withdraw = 11;                // 单笔最低提现金额
    int32 max_withdraw = 12;                // 单笔最高提现金额
    string mobile_logo = 13;                // 手机端Logo
    int32 default_agent_id = 14;            // 默认代理ID
    string default_agent_name = 15;         // 默认代理名称
    double balance = 16;                    // 总可用额度
    double balance_reset = 17;              // 剩余额度
}

message UpdateBasicSettingReq {
    int32 site_id = 1;                      // 站点ID，可选
    int32 register_time_interval = 2;       // 同一IP重复注册时间间隔
    bool switch_register = 3;               // 是否开放注册
    bool is_close = 4;                      // 是否关闭站点
    string close_reason = 5;                // 关闭原因
    string url_agent_pc = 6;                // 代理链接地址
    string url_mobile = 7;                  // 手机域名地址
    string url_agent_register = 8;          // 代理推广地址
    int32 min_withdraw = 9;                 // 单笔最低提现金额
    int32 max_withdraw = 10;                // 单笔最高提现金额
    string mobile_logo = 11;                // 手机端Logo
    string url_service = 12;                // 客服链接
}

message UpdateBasicSettingRes {
    string message = 1;                     // 响应消息
}

message GetInviteBonusConfigReq {
    int32 site_id = 1;                      // 站点ID，可选
    string code = 2;                        // 活动全局唯一编码（默认 INVITE）
}

message GetInviteBonusConfigRes {
    int32 activity_id = 1;                  // 活动ID
    string code = 2;                        // 活动编码
    int32 status = 3;                       // 活动状态
    string table = 4;                       // 活动参数表
    int32 trigger_event = 5;                // 发放触发
    int32 reward_type = 6;                  // 奖励类型
    double min_recharge_amount = 7;         // 触发最小充值金额
    double inviter_reward_amount = 8;       // 邀请人奖励金额
    string fixed_params = 9;                // 固定参数(JSON)
}

message GetSiteActivityListReq {
    int32 site_id = 1;                      // 站点ID，可选
    int32 activity_id = 2;                  // 活动ID(可选)
    string code = 3;                        // 活动编码(可选)
}

message SiteActivityInfo {
    int32 id = 1;
    string site_code = 2;
    int32 activity_id = 3;
    string name = 4;
    string code = 5;
    string description = 6;
    string start_time = 7;
    string end_time = 8;
    string fixed_params = 9;
    int32 status = 10;
    int32 sort = 11;
    string table = 12;
    string created_at = 13;
    string updated_at = 14;
}

message GetSiteActivityListRes {
    repeated SiteActivityInfo list = 1;
}

message UpdateSiteActivityReq {
    int32 site_id = 1;                      // 站点ID，可选
    int32 activity_id = 2;                  // 活动ID(可选，优先)
    string code = 3;                        // 活动编码(可选)
    string description = 4;                 // 活动描述
    string start_time = 5;                  // 开始时间
    string end_time = 6;                    // 结束时间
    string fixed_params = 7;                // 固定参数(JSON)
    int32 status = 8;                       // 状态
    int32 sort = 9;                         // 排序
    bool status_set = 10;                   // 是否更新status
    bool sort_set = 11;                     // 是否更新sort
}

message UpdateSiteActivityRes {
    bool success = 1;
    string message = 2;
}
