# GRPC Server.
grpc:
  address: ":8002"
  name: "jh_app_service_debug"
  logPath: ""
  logStdout: true
  errorStack: true
  errorLogEnabled: true
  errorLogPattern: "error-{Ymd}.log"
  accessLogEnabled: false
  accessLogPattern: "access-{Ymd}.log"

# Consul 配置
consul:
  addr: "consul:8500" # 容器内直接访问Consul
  serviceName: "jh_app_service_debug"
  servicePort: 8002
  serviceAddr: "172.19.0.31" # jh_app_service的容器IP

# Jaeger 配置
jaeger:
  endpoint: "jaeger:4317" # Jaeger OTLP gRPC 端点
  serviceName: "jh_app_service_debug" # 服务名称
  serviceVersion: "1.0.0-debug" # 服务版本
  environment: "debug" # 环境
  enabled: true # 是否启用追踪

# JWT 配置
jwt:
  secret: "be0axSSXmguDZ2Q0EIPgRwq9e5G9nRH3zq3iEw6nllU="

# Global logging - JSON格式
logger:
  level: "all"
  stdout: true
  # 使用JSON格式输出
  format: "json"
  # 时间格式
  timeFormat: "2006-01-02T15:04:05.000Z07:00"

# Database.
database:
  logger:
    level: "all"
    stdout: true

  default:
    link: "mysql:root:654321@tcp(mysql:3306)/jh_site" # 容器内直接访问MySQL
    debug: true
