apiVersion: v1
kind: Service
metadata:
  name: jh-app-service
  namespace: jh-test
  labels:
    app: jh-app-service
    env: test
spec:
  selector:
    app: jh-app-service
  ports:
    - name: grpc
      port: 8001
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: jh-test
spec:
  type: ExternalName
  externalName: host.docker.internal
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: jh-test
spec:
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
---
apiVersion: v1
kind: Endpoints
metadata:
  name: jaeger
  namespace: jh-test
subsets:
  - addresses:
      - ip: 192.168.65.254
    ports:
      - name: otlp-grpc
        port: 4317
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: jh-test
spec:
  type: ExternalName
  externalName: host.docker.internal
---
